[package]
name = "java-snippet-library"
version = "1.0.0"
description = "An offline Java snippet workbench"
authors = ["Java Snippet Library contributors"]
edition = "2021"

[lib]
name = "java_snippet_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
include_dir = "0.7"
tempfile = "3"
rfd = "0.15"

